# DC2 VyOS (equuleus) - IPsec VTI + BGP to Cloud WAN S2S VPN
# Same pattern as dc1-vyos.conf but with DC2 values:
#   - local AS 65102, router-id 10.2.0.1
#   - tunnel inside CIDRs 169.254.102.0/30 and 169.254.102.4/30
#     (AWS side .1/.5, VyOS side .2/.6)
#   - prefix-list export DC2-OUT
# Replace <PSK_1>, <PSK_2>, <TUNNEL1_OUTSIDE_IP>, <TUNNEL2_OUTSIDE_IP>, <LOCAL_PRIVATE_IP>

configure

set vpn ipsec ike-group AWS ikev2-reauth no
set vpn ipsec ike-group AWS key-exchange ikev1
set vpn ipsec ike-group AWS lifetime 28800
set vpn ipsec ike-group AWS proposal 1 dh-group 14
set vpn ipsec ike-group AWS proposal 1 encryption aes256
set vpn ipsec ike-group AWS proposal 1 hash sha256
set vpn ipsec ike-group AWS dead-peer-detection action restart
set vpn ipsec ike-group AWS dead-peer-detection interval 15
set vpn ipsec ike-group AWS dead-peer-detection timeout 30
set vpn ipsec esp-group AWS compression disable
set vpn ipsec esp-group AWS lifetime 3600
set vpn ipsec esp-group AWS mode tunnel
set vpn ipsec esp-group AWS pfs dh-group14
set vpn ipsec esp-group AWS proposal 1 encryption aes256
set vpn ipsec esp-group AWS proposal 1 hash sha256
set vpn ipsec ipsec-interfaces interface eth0

set interfaces vti vti0 address 169.254.102.2/30
set interfaces vti vti0 description 'AWS-CWAN-Tunnel1'
set interfaces vti vti1 address 169.254.102.6/30
set interfaces vti vti1 description 'AWS-CWAN-Tunnel2'

set vpn ipsec site-to-site peer <TUNNEL1_OUTSIDE_IP> authentication mode pre-shared-secret
set vpn ipsec site-to-site peer <TUNNEL1_OUTSIDE_IP> authentication pre-shared-secret '<PSK_1>'
set vpn ipsec site-to-site peer <TUNNEL1_OUTSIDE_IP> connection-type initiate
set vpn ipsec site-to-site peer <TUNNEL1_OUTSIDE_IP> description 'AWS-CWAN-T1'
set vpn ipsec site-to-site peer <TUNNEL1_OUTSIDE_IP> ike-group AWS
set vpn ipsec site-to-site peer <TUNNEL1_OUTSIDE_IP> local-address <LOCAL_PRIVATE_IP>
set vpn ipsec site-to-site peer <TUNNEL1_OUTSIDE_IP> vti bind vti0
set vpn ipsec site-to-site peer <TUNNEL1_OUTSIDE_IP> vti esp-group AWS
set vpn ipsec site-to-site peer <TUNNEL2_OUTSIDE_IP> authentication mode pre-shared-secret
set vpn ipsec site-to-site peer <TUNNEL2_OUTSIDE_IP> authentication pre-shared-secret '<PSK_2>'
set vpn ipsec site-to-site peer <TUNNEL2_OUTSIDE_IP> connection-type initiate
set vpn ipsec site-to-site peer <TUNNEL2_OUTSIDE_IP> description 'AWS-CWAN-T2'
set vpn ipsec site-to-site peer <TUNNEL2_OUTSIDE_IP> ike-group AWS
set vpn ipsec site-to-site peer <TUNNEL2_OUTSIDE_IP> local-address <LOCAL_PRIVATE_IP>
set vpn ipsec site-to-site peer <TUNNEL2_OUTSIDE_IP> vti bind vti1
set vpn ipsec site-to-site peer <TUNNEL2_OUTSIDE_IP> vti esp-group AWS

set protocols bgp 65102 neighbor 169.254.102.1 remote-as 64512
set protocols bgp 65102 neighbor 169.254.102.1 description 'AWS-CWAN-T1'
set protocols bgp 65102 neighbor 169.254.102.1 address-family ipv4-unicast prefix-list export DC2-OUT
set protocols bgp 65102 neighbor 169.254.102.1 address-family ipv4-unicast soft-reconfiguration inbound
set protocols bgp 65102 neighbor 169.254.102.1 solo
set protocols bgp 65102 neighbor 169.254.102.5 remote-as 64512
set protocols bgp 65102 neighbor 169.254.102.5 description 'AWS-CWAN-T2'
set protocols bgp 65102 neighbor 169.254.102.5 address-family ipv4-unicast prefix-list export DC2-OUT
set protocols bgp 65102 neighbor 169.254.102.5 address-family ipv4-unicast soft-reconfiguration inbound
set protocols bgp 65102 neighbor 169.254.102.5 solo

commit
save
exit
